name: Fork checks

# Tests every fork release before its image is published. Runnable on its own
# (Actions > Fork checks > Run workflow) to try a branch without releasing.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (default: the selected branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Backend vet, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet and build
        run: |
          go vet ./... && go build ./...
          (cd relaykit && go vet ./... && go build ./...)
          (cd tokenkit && go vet ./... && go build ./...)

      # TestAdaptorMasksDialedHostsInDialFailure also fails on upstream
      # QuantumNous/new-api (v1.0.0-rc.46) in a clean environment; it covers
      # advanced custom channels behind a proxy. Remove the skip once upstream
      # fixes it.
      - name: Test
        run: |
          root_module=$(go list -m)
          mapfile -t packages < <(go list -e ./... | grep -vxF "$root_module")
          go test "${packages[@]}" -skip '^TestAdaptorMasksDialedHostsInDialFailure$'
          (cd relaykit && go test ./...)
          (cd tokenkit && go test ./...)

  frontend:
    name: Frontend typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # A few heavy jsdom suites time out now and then on shared runners;
      # a retry keeps those from blocking a release, real failures still fail.
      - name: Test
        run: bunx vitest run --retry=2
